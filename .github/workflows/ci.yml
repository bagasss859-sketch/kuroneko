name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Offline tests (imports + crypto round-trip)
        run: node test/import.test.mjs && node test/crypto.test.mjs

  smoke:
    name: Smoke test (live sources)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Live smoke test (skips Doujindesu without credentials)
        run: node test/smoke.mjs
        env:
          CI: true
